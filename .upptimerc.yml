  # ---------------- Upstream vendor status, checked directly ----------------
  # Confirmed via direct curl (not assumed) which vendors expose a real
  # public JSON status API vs. which don't:
  #   - OpenAI, GitHub: real Statuspage.io API at /api/v2/status.json
  #   - EmailJS: real Better Stack API at /index.json (different field names)
  #   - Stripe, Algolia: their status pages are custom-built SPAs — hitting
  #     /api/v2/status.json returns their HTML app shell, not real data, so
  #     these are plain page-load checks only (weaker signal: proves their
  #     status page is reachable, not a parsed operational/degraded state).
  # This answers "is it them or us" when one of our own checks above fails.

  - name: Upstream - Vercel Status
    url: https://www.vercel-status.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: Upstream - OpenAI Status
    url: https://status.openai.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: Upstream - GitHub Status
    url: https://www.githubstatus.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: Upstream - EmailJS Status
    url: https://status.emailjs.com/index.json
    __dangerous__body_down_if_text_missing: '"aggregate_state":"operational"'

  - name: Upstream - Stripe Status (page only)
    url: https://status.stripe.com/

  - name: Upstream - Algolia Status (page only)
    url: https://status.algolia.com/

status-website:
  cname: status.sarvabazaar.com
  name: Sarva Bazaar Status
  introTitle: "**Sarva Bazaar Status**"
