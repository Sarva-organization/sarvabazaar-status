  # ---------------- Upstream vendor status, checked directly ----------------
  # Confirmed via direct curl (not assumed) which vendors expose a real
  # public JSON status API vs. which don't:
  #   - OpenAI, GitHub: real Statuspage.io API at /api/v2/status.json
  #   - EmailJS: real Better Stack API at /index.json (different field names)
  #   - Stripe, Algolia: their status pages are custom-built SPAs — hitting
  #     /api/v2/status.json returns their HTML app shell, not real data, so
  #     these are plain page-load checks only (weaker signal: proves their
  #     status page is reachable, not a parsed operational/degraded state).
  # This answers "is it them or us" when one of our own checks above fails.

  - name: Vercel
    slug: upstream-vercel-status
    url: https://www.vercel-status.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: OpenAI
    slug: upstream-open-ai-status
    url: https://status.openai.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: GitHub
    slug: upstream-git-hub-status
    url: https://www.githubstatus.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: EmailJS
    slug: upstream-email-js-status
    url: https://status.emailjs.com/index.json
    __dangerous__body_down_if_text_missing: '"aggregate_state":"operational"'

  - name: Stripe
    slug: upstream-stripe-status-page-only
    url: https://status.stripe.com/

  - name: Algolia
    slug: upstream-algolia-status-page-only
    url: https://status.algolia.com/

# Response-time chart on each per-monitor page. Upptime defaults to a mint
# green; these match the status green used elsewhere.
graphBackgroundColor: "rgba(118, 173, 42, 0.15)"
graphBorderColor: "#76ad2a"

status-website:
  cname: status.sarvabazaar.com

  # Rendered next to the wordmark in the masthead, so it reads "SARVA Status".
  # Also used as the browser tab title.
  name: Sarva Status
  # These MUST stay absolute, not "/favicon.png".
  # assets/ is copied into the site root only AFTER `npm run export` has run,
  # so during the export crawl a root-relative path does not exist yet. Sapper
  # fetches it, gets the SPA's 404 HTML back, and writes it as
  # `export/favicon.png/index.html` -- creating a DIRECTORY named favicon.png.
  # The asset copy that follows then dies with:
  #   cp: copyFileSync: could not write to dest file (code=EISDIR)
  # An absolute URL is a different origin from the export server, so the
  # crawler skips it; the file still resolves at runtime because assets/ lands
  # at the site root. scripts/preview.sh rewrites these to localhost so a local
  # preview does not pull them from the live site.
  logoUrl: https://status.sarvabazaar.com/favicon.png
  # Tab icon. Kept as the .ico for parity with the main site, which serves
  # /favicon.ico. Upptime hardcodes type="image/svg" and type="image/png" on
  # its two icon links with no config knob to change them, so the declared
  # MIME is wrong here; browsers sniff the bytes for rel=icon, so it renders.
  # logoUrl above stays the PNG: that is the 56px masthead image, where the
  # .ico's 32x32 would be upscaled.
  favicon: https://status.sarvabazaar.com/favicon.ico

  # No introTitle: the masthead already names the page, so a second heading
  # would just repeat it.

  # Single base theme so the cascade is predictable.
  theme: light

  css: |
    /* Sarva Bazaar status page.
       Layout, markup and behavior are Upptime's. This sets color, type and
       spacing only. The whole-card click target (article.link a::after) and the
       response-time graphs are left alone.
       Palette values are sampled from status.claude.com. */

    :root {
      --sb-bg: #faf9f5;
      --sb-surface: #ffffff;
      --sb-text: #141413;
      --sb-muted: #6b6a63;
      --sb-line: #dedcd1;

      --sb-green: #76ad2a;
      --sb-amber: #d18b1f;
      --sb-red: #c9432f;
      /* Response-time graphs, tinted by the service's current status. */
      --sb-graph-up: #b3d78d;
      --sb-graph-degraded: #f2d49b;
      --sb-graph-down: #efb0a4;

      --body-background-color: var(--sb-bg);
      --body-text-color: var(--sb-text);
      --card-background-color: var(--sb-surface);
      --card-border-color: var(--sb-line);
      --nav-background-color: var(--sb-bg);
      --nav-border-bottom-color: var(--sb-line);
      --nav-current-border-bottom-color: var(--sb-text);
      --code-color: var(--sb-text);
      --code-background-color: var(--sb-bg);

      --up-border-left-color: var(--sb-green);
      --degraded-border-left-color: var(--sb-amber);
      --down-border-left-color: var(--sb-red);
      --down-background-color: var(--sb-surface);

      --tag-color: #ffffff;
      --tag-up-background-color: var(--sb-green);
      --tag-degraded-background-color: var(--sb-amber);
      --tag-down-background-color: var(--sb-red);
      /* brief flash behind a value when the selected range changes */
      --change-background-color: #dcecc4;

      --error-button-border-color: var(--sb-text);
      --error-button-background-color: var(--sb-text);
      --error-button-color: #ffffff;
      --submit-button-border-color: var(--sb-text);
      --submit-button-background-color: var(--sb-text);
      --submit-button-color: #ffffff;

      --graph-opacity: 1;
      --graph-filter: none;
    }

    html body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      background: var(--sb-bg);
      color: var(--sb-text);
      line-height: 1.5;
    }

    body .container {
      max-width: 860px;
    }

    body h1,
    body h2,
    body h3,
    body h4 {
      color: var(--sb-text);
      font-weight: 600;
    }

    body a,
    body h1 a,
    body h2 a,
    body h3 a,
    body h4 a {
      color: var(--sb-text);
    }

    /* ---------- Masthead: wordmark followed by the site name ---------- */

    body nav {
      background: var(--sb-bg);
      border-bottom: 0;
      padding: 0;
      margin-bottom: 1.5rem;
    }

    body nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      padding-bottom: 0px !important;
    }

    body a.error-button {
      margin-top: 1rem;
    }

    body nav .logo {
      float: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      margin: 0;
      text-decoration: none;
    }

    body nav {
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
    }

    /* The wordmark is set to the cap height of the name beside it so the two
       read as a single line of text rather than an image plus a label.
       Nav.svelte ships `.logo.svelte-<hash> img.svelte-<hash> { height: 3rem }`,
       which is more specific than anything that can be written here (the hash
       changes on template updates and cannot be referenced), so these need
       !important to apply. Change `height` to resize the wordmark. */
    body nav .logo img {
      height: 56px !important;
      width: auto !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }

    body nav .logo div {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--sb-text);
      line-height: 1 !important;
      margin-top: -1px !important;
    }

    body nav ul {
      margin: 0;
      padding: 0;
    }

    /* On service-history pages, the existing logo link already points home.
       Present it like the incident page's simple footer link instead of
       repeating the masthead used on the status homepage. */
    body:not(:has(main > section.live-status)) nav .logo img,
    body:not(:has(main > section.live-status)) nav .logo div {
      display: none;
    }

    body:not(:has(main > section.live-status)) nav .logo {
      padding: 0;
      margin: 0;
      margin-bottom: 1.5rem;
      border: 0;
      border-radius: 0;
      font-size: 0.85rem !important;
      font-weight: 400 !important;
      line-height: 1 !important;
      color: var(--sb-muted) !important;
      text-decoration: underline !important;
      text-underline-offset: 3px !important;
    }

    body:not(:has(main > section.live-status)) nav .logo:hover {
      color: var(--sb-text);
    }

    body:not(:has(main > section.live-status)) nav .logo::after {
      content: "← Back to status";
    }

    /* Incident pages already provide their own “Back to all incidents” link
       at the end of the page, and the error page provides “Return home”.
       Neither needs a second navigation link. */
    body:has(main > h2 + section + footer) nav,
    body:has(main > a.error-button) nav {
      display: none;
    }

    /* The hidden nav normally supplies this top breathing room. Keep it on
       pages that use their own return link so their content is not flush with
       the viewport. */
    body:has(main > h2 + section + footer) main.container,
    body:has(main > a.error-button) main.container {
      padding-top: 53px;
    }

    /* ---------- Overall status banner ---------- */
    /* Upptime hardcodes a leading emoji in this element, so the element's own
       text is collapsed to zero and the label is restated here.
       i18n.allSystemsOperational stays set as the no-CSS fallback. */

    main.container > article.up,
    main.container > article.degraded,
    main.container > article.down {
      font-size: 0;
      border: 0;
      border-radius: 4px;
      padding: 14px 20px;
      margin-top: 1.5rem !important;
    }

    main.container > header {
      margin-bottom: 0 !important;
    }

    main.container > article.up::before,
    main.container > article.degraded::before,
    main.container > article.down::before {
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
    }

    main.container > article.up {
      background: var(--sb-green);
    }
    main.container > article.up::before {
      content: "All Systems Operational";
    }

    main.container > article.degraded {
      background: var(--sb-amber);
    }
    main.container > article.degraded::before {
      content: "Degraded Performance";
    }

    main.container > article.down,
    main.container > article.down-active {
      background: var(--sb-red);
    }
    main.container > article.down::before {
      content: "Service Disruption";
    }

    /* ---------- Component list ---------- */
    /* Upptime's own card layout is kept: separate cards, each with the status
       colour on its left edge and its response-time graph on the right. */

    section.live-status article h4 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    section.live-status article > div {
      color: var(--sb-muted);
      font-size: 0.82rem;
    }

    /* No `background` here: Upptime flashes these values on a range switch via
       `.changed + section .data { background: var(--change-background-color) }`,
       fading it out with its own 0.3s transition. Setting a background would
       disable that animation. */
    section.live-status article .data {
      color: var(--sb-text);
      font-weight: 500;
    }

    /* Response-time graph, recoloured.
       The source PNGs are mint on a transparent background, so they are used as
       a mask and painted in the page's green instead. Geometry is copied from
       Upptime's own rule (contain / no-repeat / center right) so the graph is
       drawn exactly where and how it was before.
       `article` is already position:relative, so adding z-index:0 makes it a
       stacking context; the mask then sits above the card background but below
       the text, and the full-card click overlay (article.link a::after) keeps
       the article as its containing block and still covers the whole card. */
    section.live-status article.graph {
      z-index: 0;
      background-image: none !important;
    }

    section.live-status article.graph::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      /* keeps the graph inside the card's rounded corners */
      border-radius: inherit;
      background: var(--sb-graph-up);
      -webkit-mask-image: var(--background);
      mask-image: var(--background);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center right;
      mask-position: center right;
    }

    section.live-status article.degraded.graph::after {
      background: var(--sb-graph-degraded);
    }

    section.live-status article.down.graph::after {
      background: var(--sb-graph-down);
    }

    /* ---------- Per-monitor descriptions ---------- */
    /* Upptime has no description field, so the text is keyed to each row's
       history link below. Rows without a match render without the line. */

    section.live-status article h4::after {
      display: block;
      margin-top: 3px;
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--sb-muted);
    }

    section.live-status article:has(a[href$="/history/website"]) h4::after {
      content: "Main storefront and public pages at sarvabazaar.com.";
    }

    section.live-status article:has(a[href$="/history/guest-shop"]) h4::after {
      content: "Browsing products and building a basket without an account.";
