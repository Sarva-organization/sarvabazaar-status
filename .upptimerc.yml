    /* ---------- Live Status heading and range switcher ---------- */

    /* Upptime adds and removes `.changed` on this row to trigger the value-flash
       animation, so styling must not depend on that class or the heading resizes
       every time a range is selected. The row is identified by shape instead. */
    body .f:has(> h2) {
      align-items: baseline;
      margin-bottom: 12px;
    }

    body .f h2 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0;
    }

    body .r label {
      color: var(--sb-muted);
      font-size: 1rem;
    }

    body .r input:checked + label {
      color: var(--sb-text);
    }

    /* ---------- Incident history ---------- */

    main.container section > h2 {
      font-size: 1.75rem;
      margin-top: 3rem;
    }

    /* Date heading, with a rule beneath it. */
    main.container section > h3 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--sb-text);
      opacity: 1;
      border-bottom: 1px solid var(--sb-line);
      padding-bottom: 10px;
      margin: 2rem 0 1rem;
    }

    main header {
      margin-bottom: 1.8rem !important;
    }

    main.container section > article.link h4 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    main.container section > article.link .f > div > div {
      color: var(--sb-muted);
      font-size: 0.85rem;
    }

    main.container section > article.link .f.r a {
      color: var(--sb-muted);
      font-size: 0.85rem;
    }

    /* ---------- Tags ---------- */

    body .tag {
      border-radius: 3px;
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ---------- Buttons ---------- */

    body .submit-button,
    body a.error-button {
      border-radius: 4px !important;
    }

    /* ---------- Per-monitor and incident pages ---------- */

    body dl dt {
      color: var(--sb-muted);
      font-size: 0.82rem;
      font-weight: 500;
    }

    body dl dd {
      color: var(--sb-text);
    }

    /* ---------- Footer ---------- */

    body footer {
      color: var(--sb-muted);
      font-size: 0.85rem;
    }

    body footer a {
      color: var(--sb-muted);
    }

    /* ---------- Shared page furniture ---------- */
    /* The status homepage takes its title from the masthead, but the error,
       rate-limit, per-monitor and incident pages each render their own heading.
       These give all of them the same scale as the section headings above. */

    main.container > h1,
    main.container section > h1,
    main.container > h2:first-child {
      font-size: 1.75rem;
      line-height: 1.25;
    }

    /* Subheadings inside the error and rate-limit copy sit below the page title. */
    main.container > h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    main.container > p,
    main.container p.lead {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 68ch;
    }

    /* Token field on the rate-limit page, matched to the buttons. */
    main.container form label span {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--sb-muted);
    }

    main.container form input[type="text"] {
      font: inherit;
      font-size: 0.95rem;
      padding: 9px 12px;
      min-width: 0;
      width: 100%;
      max-width: 420px;
      color: var(--sb-text);
      background: var(--sb-surface);
      border: 1px solid var(--sb-line);
      border-radius: 4px;
      box-sizing: border-box;
    }

    main.container form input[type="text"]:focus {
      outline: 2px solid var(--sb-text);
      outline-offset: 1px;
      border-color: transparent;
    }

    /* `a.error-button` is an <a>, so it is an inline box by default, and vertical
       margins are ignored on inline boxes. A `margin-top` on it is therefore a
       valid declaration that does nothing, which is why it shows as applied
       rather than overridden. Giving it a block box makes margin-top take effect.
       It stays in the text flow, so the desktop layout is otherwise unchanged;
       the mobile rules further down switch it to `block` to centre it. */
    body a.error-button {
      display: inline-block;
    }

    /* "Back to all incidents" on the incident page, matched to the masthead's
       back link so both read the same way. */
    main.container > footer a {
      font-size: 0.85rem;
      color: var(--sb-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    main.container > footer a:hover {
      color: var(--sb-text);
    }

    /* ---------- Responsive ---------- */
    /* Sizing and flow only. Vertical spacing is left to the rules above so the
       rhythm set there still applies at every width. */

    @media (max-width: 640px) {
      /* global.css sets 2rem of side padding, which costs a sixth of a phone
         screen. */
      body .container {
        padding-left: 16px;
        padding-right: 16px;
      }

      /* Nav.svelte sets overflow-x:auto on the bar, so an oversized masthead
         scrolls sideways out of view instead of visibly wrapping. Scale it to
         fit rather than letting it clip. */
      body nav .logo img {
        height: 34px !important;
      }

      body nav .logo div {
        font-size: 1.5rem;
      }

      main.container > article.up::before,
      main.container > article.degraded::before,
      main.container > article.down::before {
        font-size: 0.95rem;
      }

      /* Heading and range switcher stop competing for one line. */
      body .f:has(> h2) {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      main.container > article.up {
        text-align: center;
      }

      body nav .container {
        justify-content: center !important;
      }

      body .f h2,
      main.container section > h2,
      main.container > h1,
      main.container section > h1,
      main.container > h2:first-child {
        font-size: 1.35rem;
        text-align: center;
      }

      main.container section > h3 {
        font-size: 1.1rem;
        text-align: center;
      }

      /* Same centring applied to the remaining pages, so the error, rate-limit,
         per-monitor and incident views match the homepage at this width.
         Cards and body copy stay left aligned; only page chrome is centred. */

      /* Subheadings in the error and rate-limit copy. */
      main.container > h2 {
        text-align: center;
      }

      /* The masthead's back link on per-monitor and rate-limit pages. */
      body:not(:has(main > section.live-status)) nav .logo {
        text-align: center;
      }

      /* Short metadata sits under a centred title on both the per-monitor page
         (uptime, average response) and the incident page (opened, closed). */
      main.container section > dl,
      main.container section > .f > dl {
        text-align: center;
      }

      /* Incident page: the GitHub link and the meta block above it.
         `align-items: stretch` matters here. Centring the flex items instead
         would shrink the <dl> to its widest line, so a short label like
         "Opened at" would centre inside that box while the timestamp below it
         filled the box and read as left aligned. */
      main.container section > .f,
      main.container section > .f > .r {
        align-items: stretch;
        text-align: center;
      }

      /* "Back to all incidents" and the error page's home button. */
      main.container > footer {
        text-align: center;
      }

      main.container > a.error-button {
        display: block;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
      }

      /* The error page is short enough that centring its copy too reads better
         than a centred heading over left-aligned text. Longer pages keep their
         paragraphs left aligned for readability. */
      body:has(main > a.error-button) main.container {
        text-align: center;
      }

      /* Token form on the rate-limit page. */
      main.container form {
        text-align: center;
      }

      main.container form input[type="text"] {
        margin-left: auto;
        margin-right: auto;
      }

      /* The range switcher spreads across the row instead of relying on the
         1rem left margin each label carries. */
      body form.f.r {
        width: 100%;
        justify-content: space-evenly;
        flex-wrap: nowrap;
      }

      body form.f.r label {
        margin-left: 0 !important;
        font-size: 0.9rem;
      }

      /* `contain` sizes the graph from the card's height. A narrow card is tall
         enough that this puts the graph behind the text, so at this width it is
         pinned to a corner strip instead. */
      section.live-status article.graph::after {
        -webkit-mask-size: auto 48%;
        mask-size: auto 48%;
        -webkit-mask-position: right bottom;
        mask-position: right bottom;
      }

      section.live-status article h4 {
        font-size: 0.95rem;
      }

      /* Incident rows and incident-page metadata stack rather than squeeze. */
      main.container section > article.link .f,
      main.container section > .f {
        flex-direction: column;
        gap: 6px;
      }

      /* Only the home page's incident cards keep their contents left aligned;
         alignment for the incident page's own meta block is set above. Setting
         align-items on both here would shrink that block's <dl> to its widest
         line and undo the centring. */
      main.container section > article.link .f {
        align-items: flex-start;
      }

      main.container section > article.link .f.r {
        justify-content: flex-start;
        text-align: left;
      }

      main.container section > article p {
        font-size: 0.95rem;
      }
    }

    /* Very narrow phones: keep the masthead on one line. */
    @media (max-width: 380px) {
      body nav .logo img {
        height: 28px !important;
      }

      body nav .logo div {
        font-size: 1.25rem;
      }
    }
