    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Firebase Storage
    url: https://www.sarvabazaar.com/api/health/firebase-storage
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Search (Algolia)
