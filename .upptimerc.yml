owner: Sarva-organization
repo: sarvabazaar-status
user-agent: Shahir-47

# Explicit allowlist (recommended over relying on automatic detection) of
# every repo secret referenced below via $NAME syntax.
secrets:
  - HEALTH_CHECK_SECRET

assignees:
  - Shahir-47

# Keep every incident in history, even sub-15-minute blips that Upptime would
# otherwise silently delete — more data, not less.
skipDeleteIssues: true

sites:
  # Real SSR page, actually fetches live vendor data from Firestore
  # (getLiveVendors, revalidate=60) — not static marketing copy. Checked from
  # multiple world regions via Globalping instead of a single GitHub Actions
  # runner location, since it's the single most important page in the app.
  - name: Website
    url: https://www.sarvabazaar.com
    type: globalping
    location: World

  # Real SSR/public-API pages that are genuinely reachable with no auth — a
  # plain GET here is a meaningful signal. Dashboards/copilot pages are
  # deliberately excluded: auth in this app is client-side only (Firebase
  # onAuthStateChanged + router.replace), so an unauthenticated GET to e.g.
  # /customer/dashboard always returns 200 with a loading shell regardless of
  # whether the app is actually healthy — a plain status-code check there
  # would be a permanently-green no-op, not a weaker check.
  - name: Guest Shop
    url: https://www.sarvabazaar.com/order

  - name: Vendor Listing
    url: https://www.sarvabazaar.com/order/vendors

  - name: Order Status Lookup
    url: https://www.sarvabazaar.com/order-status

  - name: Customer Sign In
    url: https://www.sarvabazaar.com/customer/auth/signin

  - name: Vendor Sign In
    url: https://www.sarvabazaar.com/vendor/auth/signin

  - name: Driver Sign In
    url: https://www.sarvabazaar.com/driver/auth/signin

  - name: Customer Signup
    url: https://www.sarvabazaar.com/customer/auth/signup

  - name: Vendor Signup
    url: https://www.sarvabazaar.com/vendor/auth/signup

  - name: Driver Signup
    url: https://www.sarvabazaar.com/driver/auth/signup

  # Public route handler with real, uncached-on-miss Firestore reads
  # (vendors + inventory collections) — no auth required. Backs /order and
  # /order/vendors client-side.
  - name: Public Catalog API
    url: https://www.sarvabazaar.com/api/catalog

  # ---------------- Our own dependency health checks ----------------
  # All gated by HEALTH_CHECK_SECRET; maxResponseTime tightened from the 30s
  # default since these are simple API pings that should be fast — a slow
  # response here (not just an outright failure) is itself a useful signal.

  - name: Payments (Stripe)
    url: https://www.sarvabazaar.com/api/health/stripe
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Firestore
