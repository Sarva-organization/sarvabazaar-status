owner: Sarva-organization
repo: sarvabazaar-status
user-agent: Shahir-47

# Explicit allowlist (recommended over relying on automatic detection) of
# every repo secret referenced below via $NAME syntax.
secrets:
  - HEALTH_CHECK_SECRET

assignees:
  - Shahir-47

# Keep every incident in history, even sub-15-minute blips that Upptime would
# otherwise silently delete — more data, not less.
skipDeleteIssues: true

sites:
  # Real SSR page, actually fetches live vendor data from Firestore
  # (getLiveVendors, revalidate=60) — not static marketing copy. Checked from
  # multiple world regions via Globalping instead of a single GitHub Actions
  # runner location, since it's the single most important page in the app.
  - name: Website
    slug: website
    url: https://www.sarvabazaar.com
    type: globalping
    location: World

  # Real SSR/public-API pages that are genuinely reachable with no auth — a
  # plain GET here is a meaningful signal. Dashboards/copilot pages are
  # deliberately excluded: auth in this app is client-side only (Firebase
  # onAuthStateChanged + router.replace), so an unauthenticated GET to e.g.
  # /customer/dashboard always returns 200 with a loading shell regardless of
  # whether the app is actually healthy — a plain status-code check there
  # would be a permanently-green no-op, not a weaker check.
  - name: Guest Shopping
    slug: guest-shop
    url: https://www.sarvabazaar.com/order

  - name: Shop Directory
    slug: vendor-listing
    url: https://www.sarvabazaar.com/order/vendors

  - name: Order Tracking
    slug: order-status-lookup
    url: https://www.sarvabazaar.com/order-status

  - name: Customer Sign-In
    slug: customer-sign-in
    url: https://www.sarvabazaar.com/customer/auth/signin

  - name: Shop Owner Sign-In
    slug: vendor-sign-in
    url: https://www.sarvabazaar.com/vendor/auth/signin

  - name: Driver Sign-In
    slug: driver-sign-in
    url: https://www.sarvabazaar.com/driver/auth/signin

  - name: Customer Registration
    slug: customer-signup
    url: https://www.sarvabazaar.com/customer/auth/signup

  - name: Shop Owner Registration
    slug: vendor-signup
    url: https://www.sarvabazaar.com/vendor/auth/signup

  - name: Driver Registration
    slug: driver-signup
    url: https://www.sarvabazaar.com/driver/auth/signup

  # ---------------- Our own dependency health checks ----------------
  # All gated by HEALTH_CHECK_SECRET; maxResponseTime tightened from the 30s
  # default since these are simple API pings that should be fast — a slow
  # response here (not just an outright failure) is itself a useful signal.

  - name: Payments
    slug: payments-stripe
    url: https://www.sarvabazaar.com/api/health/stripe
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Database
    slug: firestore
    url: https://www.sarvabazaar.com/api/health/firestore
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Account Authentication
    slug: firebase-auth
    url: https://www.sarvabazaar.com/api/health/firebase-auth
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Abuse Protection
    slug: firebase-app-check
    url: https://www.sarvabazaar.com/api/health/firebase-appcheck
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Media Storage
    slug: firebase-storage
    url: https://www.sarvabazaar.com/api/health/firebase-storage
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Product Search
    slug: search-algolia
    url: https://www.sarvabazaar.com/api/health/algolia
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Voice and AI Assistant
    slug: ai-open-ai
    url: https://www.sarvabazaar.com/api/health/openai
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Maps and Addresses
    slug: maps
    url: https://www.sarvabazaar.com/api/health/maps
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Incident Reporting
    slug: support-git-hub-api
    url: https://www.sarvabazaar.com/api/health/github
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Email Notifications
    slug: email-alerts-config
    url: https://www.sarvabazaar.com/api/health/email
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Pure arithmetic with no external dependency, so the only thing that can
  # make it slow is a cold start.
  - name: Order Pricing
    slug: pricing-flow
    url: https://www.sarvabazaar.com/api/health/flow-quote
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Checkout
    slug: checkout-flow
    url: https://www.sarvabazaar.com/api/health/flow-checkout
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Unlike everything else here, this one fails on the *data* being wrong rather
  # than on a dependency being unreachable: checkout takes stock at draft time,
  # before payment, so stock that is never handed back is stranded silently.
  # Four Firestore queries (negative units, paid-but-unconfirmed orders,
  # drafts past the purge window, inventory whose derived totals stopped
  # tracking units), so the same bound as the other Firestore-only checks.
  - name: Stock Accuracy
    slug: checkout-stock-flow
    url: https://www.sarvabazaar.com/api/health/flow-checkout-stock
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Search Results
    slug: search-flow
    url: https://www.sarvabazaar.com/api/health/flow-search
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Asserts the *shape* of the search index rather than that Algolia answered,
  # because every failure mode behind the shop grid is silent: a missing sort
  # replica returns primary order, a filterOnly facet returns no counts, and a
  # filter on an undeclared attribute returns zero hits. None of them error, so
  # a shopper just sees an oddly-ordered grid or an empty shelf.
  # Nine sequential getSettings calls (primary plus the four sort replicas,
  # checked twice — once for facets, once for stray custom ranking) plus the
  # approved-vendor read and one real scoped query, hence the wider bound than
  # a single-query check. Measured ~580ms server-side warm.
  - name: Product Filters and Sorting
    slug: shop-search-flow
    url: https://www.sarvabazaar.com/api/health/shop-search
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The one check here whose failure is invisible even in the data: the query
  # side and the stored vectors must come from the same embedding model, and if
  # they drift apart nothing errors — findNearest just returns confident
  # nonsense. Embeds one product's own text and compares it against that
  # product's stored vector, so agreement should be near-total.
  # Reads the whole inventory collection (embedding coverage degrades quietly as
  # un-enriched items pile up) and then makes an OpenAI embeddings call, so this
  # gets a looser bound than the rest — it is the only check here whose cost
  # grows with the catalog. Measured ~2.1s server-side.
  - name: Search Relevance
    slug: semantic-search-flow
    url: https://www.sarvabazaar.com/api/health/semantic-search
    maxResponseTime: 15000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The shared base under all four text engines and four voice modes: the API
  # keys, the two indices their tool calls query, and the attributes those calls
  # filter on. A missing key or a dropped facet surfaces as an assistant that
  # says "I couldn't find anything" — indistinguishable from a genuinely empty
  # result, and it never logs. Deliberately makes no model call, so this is
  # three Algolia round trips rather than a billed completion per poll — the
  # same bound as the other Algolia checks. Measured ~50ms server-side.
  - name: Assistant Lookups
    slug: assistants-flow
    url: https://www.sarvabazaar.com/api/health/assistants
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Commits the real multi-document read-then-write transaction shape every
  # order transition uses (seed batch, transaction over three docs, verify,
  # cleanup batch), not the one-read one-write case that can never fail — hence
  # the wider bound than a single-query check.
  - name: Order Processing
    slug: order-flow
    url: https://www.sarvabazaar.com/api/health/flow-order
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Order Confirmation
    slug: order-confirmation-flow
    url: https://www.sarvabazaar.com/api/health/flow-order-confirmation
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # A dead-man's switch rather than a reachability probe: the background jobs
  # (abandoned-checkout purge, payout retries, storage cleanup, stats pruning,
  # weekly account reconciliation/repair) fail by silently ceasing to fire, and
  # a schedule that stops produces no invocation, no error and no log line to
  # alert on. Cloud Scheduler's own lastAttemptTime is not a substitute — it has
  # been observed a week stale on a job that demonstrably ran. So each job
  # stamps Firestore on completion and this check fails when a stamp goes stale
  # or records a failed run. Six document reads, so the same bound as the other
  # Firestore-only checks. POS jobs are excluded while that work is in beta.
  - name: Background Jobs
    slug: scheduled-functions
    url: https://www.sarvabazaar.com/api/health/functions
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The two jobs below are broken out of the aggregate because their silence
  # costs money directly, and each has a different response. The other four
  # (draft cleanup, stats pruning, weekly account reconcile/repair) are
  # slow-burn housekeeping — a week of missed runs has no user-visible effect —
  # so they stay in the group above rather than earning a row each.

  # Cancels the PaymentIntent on an abandoned checkout and hands the reserved
  # units back to inventory. If it stops, stock stays stranded against orders
  # nobody is going to pay for and the shelf quietly empties.
  - name: Abandoned Checkout Cleanup
    slug: purge-pending-orders
    url: https://www.sarvabazaar.com/api/health/functions?job=purgeStalePendingOrders
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Retries vendor/driver payouts that failed after the charge was captured.
  # Its silence is the worst kind: the customer has already been charged and
  # nobody has been paid, and nothing else in the system will notice.
  - name: Payout Retries
    slug: reconcile-failed-transfers
    url: https://www.sarvabazaar.com/api/health/functions?job=reconcileFailedTransfers
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Warns drivers 30 days, 7 days and the day a compliance document lapses.
  # Silence here is invisible until it is expensive: expiry blocks the next
  # accept the moment a date passes, so a driver who was never warned simply
  # finds themselves refused a job one morning with no notice. Daily, because
  # the stages are daily — a late run turns "7 days left" into "one day left".
  - name: Document Expiry Reminders
    slug: driver-expiry-reminders
    url: https://www.sarvabazaar.com/api/health/functions?job=driverExpiryReminders
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Deletes superseded document images after 90 days and archived compliance
  # records after 7 years. If it stops, nothing breaks and nobody notices —
  # which is the problem: photographs of drivers' licences accumulate in the
  # bucket indefinitely, including for accounts that were closed.
  - name: Driver Document Retention
    slug: purge-driver-compliance
    url: https://www.sarvabazaar.com/api/health/functions?job=purgeDriverComplianceData
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # ---------------- Event-driven function checks ----------------
  # The dead-man's switch above cannot work for a Firestore trigger: it fires on
  # data events, so "hasn't run in three hours" is normal when nobody edited
  # anything. What a detached or failing trigger leaves behind is wrong DATA, so
  # four of these five assert the invariant each trigger exists to maintain
  # (derived inventory totals, shop coordinates on items, the public order
  # mirror, search-index parity). Samples are bounded (50 items / 25 orders) and
  # skip anything written in the last two minutes, since the triggers are
  # asynchronous.
  #
  # The fifth, trigger-liveness, covers the blind spot in the other four: the
  # derived-field check compares stored values against a recomputation, so a
  # detached trigger stays invisible for as long as every writer happens to
  # compute correctly on its own. It instead compares each trigger's own
  # heartbeat against the newest write to the collection it watches — a
  # collection written well after its trigger last fired means broken wiring.
  # Measured ~1.2s for all five.
  - name: Data Consistency
    slug: trigger-functions
    url: https://www.sarvabazaar.com/api/health/triggers
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Its own row because it is the only trigger whose failure is visible to
  # someone outside the company: orders_public is what the public order-tracking
  # pages read, so an unmirrored order is a customer who cannot see their
  # delivery. Measured ~150ms.
  - name: Order Tracking Sync
    slug: order-mirror
    url: https://www.sarvabazaar.com/api/health/triggers?check=order-mirror
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Firestore reads plus a Stripe webhookEndpoints.list, hence the wider bound
  # than the pure-Firestore checks.
  - name: Payment Updates
    slug: webhooks-flow
    url: https://www.sarvabazaar.com/api/health/flow-webhooks
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Shop and Driver Payouts
    slug: payouts-flow
    url: https://www.sarvabazaar.com/api/health/flow-payouts
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The payouts PAGE, where the row above watches the money itself. One
  # component serves /vendor/payouts and /driver/payouts, and both driver
  # assistants answer "when do I get paid" from the same numbers — so a red here
  # is the page and all four engines wrong together.
  #
  # Everything it asserts fails silently in production. The page draws "$0.00
  # paid out" over an empty table just as readily for a broken earnings split as
  # for a shop that has not sold anything, and nothing logs either way:
  #   - the split itself. The vendor is owed the item subtotal and the driver the
  #     delivery fee plus tip; paying either one `total` hands them the other's
  #     money plus the customer's tax. Graded against a fixture whose fields are
  #     all different, so confusing two of them cannot still add up;
  #   - the order of the state test. A failed transfer is STILL a captured
  #     charge, so checking capture first reports money nobody received as "Paid
  #     out" — the worst sentence this page could print;
  #   - created_at_ts being epoch seconds. This shipped wrong and dated every row
  #     on both payout pages to January 1970. Sampled from live orders, since the
  #     risk is a writer switching to milliseconds, not the reader;
  #   - the (vendorID|driverID, created_at_ts) indexes, which 500 the whole page
  #     when absent — and only in the environment that is missing one.
  # It grades the functions the route actually calls rather than a copy, so it
  # cannot drift green the way a re-implementation would. Two sentinel queries
  # and one five-document read, so the same bound as the other Firestore checks.
  # Measured ~270ms server-side warm.
  - name: Payouts Page
    slug: payouts-page-flow
    url: https://www.sarvabazaar.com/api/health/flow-payouts-page
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The two payout APIs' auth gate, checked from outside with NO credentials.
  # Everything else here runs server-side against the handler's logic; these are
  # the only rows that exercise the secureRoute wrapper itself, over real HTTP,
  # the way an attacker would reach it.
  #
  # 401 is the pass condition, so both failure directions are caught by one
  # assertion: a 200 means the gate opened and one signed-out request can read
  # somebody's bank-transfer history, and a 5xx means the payouts page is broken
  # for everyone who IS signed in. Only an exact 401 is both closed and working.
  #
  # withAuth returns 401 for a missing token, an invalid token AND a missing App
  # Check header, so this stays a single expected code in production where App
  # Check is enforced. 403 is reserved for requireRoles, which neither route uses
  # — if one ever starts, that shows up here as a failure rather than silently.
  - name: Payout History Auth Gate
    slug: payouts-orders-auth
    url: https://www.sarvabazaar.com/api/payouts/orders
    expectedStatusCodes:
      - 401
    maxResponseTime: 5000

  # POST because that is the only method the route exports; a GET would answer
  # 405 from the framework without ever reaching the auth wrapper, which would
  # pass while proving nothing. Safe to call unauthenticated — it 401s before it
  # can mint a Stripe AccountSession.
  - name: Payout Session Auth Gate
    slug: payouts-session-auth
    url: https://www.sarvabazaar.com/api/payouts/session
    method: POST
    expectedStatusCodes:
      - 401
    maxResponseTime: 5000

  # The metrics BOTH vendor assistants answer from — the Algolia aggregation,
  # the stock-value sum and the vendor_stats rollup — plus the two fingerprints
  # that keep the cache honest.
  #
  # Those fingerprints are the reason this needs watching. Each swallows its own
  # errors and reports "cannot tell", deliberately: one that reported "changed"
  # on failure would rebuild from Algolia on every assistant turn. The cost is
  # that a missing inventory index degrades the cache to a bare five-minute
  # timer, and both engines start quoting stale stock and inventory value with
  # nothing anywhere saying so. The check runs the same two reads unswallowed.
  - name: Shop Owner Dashboard
    slug: vendor-metrics-flow
    url: https://www.sarvabazaar.com/api/health/flow-vendor-metrics
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Same rewrite the Customer Dashboard check below got, for the same reason.
  # This used to call computeDriverMetrics({}, []) and assert the totals came
  # back zero — a function returning zeros for an empty array cannot fail, so it
  # was green by construction. It now exercises the actual path: the
  # driver_stats cache read, the transactions fingerprint, and the two live
  # order queries the page runs beside it.
  #
  # Three things the sentinel account alone cannot prove are re-run over a
  # fixture with real numbers in it, because every figure is legitimately zero
  # for a driver who owns nothing:
  #   - the aggregation. Its worst failure is an accepted-but-undelivered job
  #     counting as earnings, which would report money the driver was never
  #     paid;
  #   - the "Available now" query. It is UNSCOPED, so a missing index reads as
  #     an empty card — indistinguishable from no shop having anything packed;
  #   - the chart's bucket counts. The page assumes 7 / 30 / 12, and a short
  #     series silently changes what "the last 7 days" means.
  #
  # The payload it asserts field-by-field is also what both driver assistants
  # answer earnings questions from, so a red here means all three are wrong —
  # not just the page. A handful of Firestore round trips, so it keeps the 5s
  # bound of the other Firestore-backed flows.
  - name: Driver Dashboard
    slug: driver-metrics-flow
    url: https://www.sarvabazaar.com/api/health/flow-driver-metrics
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # The driver's exported report — the PDF and workbook behind "Export Driver
  # Report", which drivers use to reconcile income at tax time.
  #
  # Every failure here is silent. Both generators are deliberately defensive, so
  # a renamed or dropped field does not throw: the document still builds and
  # still downloads, with "N/A" and "$0.00" where the numbers should be. So this
  # asserts the payload's SHAPE — around thirty fields the two documents read by
  # name — and its arithmetic, rather than that a call succeeded.
  #
  # Two of those sums are worth naming. A delivered order with no
  # driverTransaction behind it is a real case, and if the merge stops folding
  # those in the report simply under-reports what the driver earned. And
  # pickup/delivery efficiency is STORED as a 0..1 ratio but REPORTED as a
  # percentage — get that wrong and every driver is graded against thresholds of
  # 70/80/90 they cannot reach, which is a bug this codebase has already had.
  #
  # Two indexed Firestore reads against a sentinel that owns nothing (a missing
  # index there 500s the whole export), then pure arithmetic.
  - name: Driver Report
    slug: driver-report-flow
    url: https://www.sarvabazaar.com/api/health/flow-driver-report
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Driver compliance: which documents a driver owes, whether they are valid,
  # and everything that reads that answer — the accept gate on both paths, the
  # onboarding hold, the expiry reminder cadence, and the storage path guard.
  #
  # Every failure mode here is SILENT, which is the only reason this is worth a
  # monitor. Nothing throws in production when it breaks:
  #   - an empty required-documents list makes every driver "compliant" and the
  #     gate waves everyone through
  #   - expiry stored instead of derived leaves a lapsed licence reading as
  #     approved forever
  #   - a path guard that stops rejecting other drivers' folders lets a driver
  #     register somebody else's object as their own document
  #   - a block code with no message tells a refused driver only that "that
  #     action couldn't be completed", which is what the voice path really said
  #     until the two message tables were merged
  #   - reminder de-duplication breaking emails the same lapsed document every
  #     morning until deliverability is gone
  #
  # Pure arithmetic against fixtures with real dates, plus two reads against a
  # sentinel driver who owns nothing. The response name reports whether
  # enforcement is currently on, so the status page shows which mode is live.
  - name: Driver Compliance
    slug: driver-compliance-flow
    url: https://www.sarvabazaar.com/api/health/flow-driver-compliance
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # A driver's Deliveries page: the live board, and the Completed tab's
  # plain-language search — which is also the search both driver assistants run.
  #
  # Like Order History and Search below, this asserts the index's SHAPE rather
  # than that Algolia answered, because every failure mode behind it is silent
  # and all of them read to a driver as "you have no deliveries":
  #   - a sort replica that doesn't exist is a hard 404 that fails the WHOLE
  #     search;
  #   - a replica that exists but was never given a ranking formula returns the
  #     primary's order, so ascending and descending come back identical and the
  #     arrow in the UI simply lies;
  #   - a numeric filter on an attribute the index doesn't declare EXCLUDES
  #     every record, so "deliveries that made me more than $5" answers "you
  #     have never had a well-paying job".
  #
  # Pay gets checked twice over, because it is the one that was shipped broken
  # for months: the attribute has to be declared on the PRIMARY and forwarded to
  # the pay REPLICA, since a filter applied while sorting runs against the
  # replica — declaring only on the primary breaks exactly "best paying jobs
  # over $10" while each half works alone. The DRIVER_PAY_SORTABLE flag and the
  # index must also agree in BOTH directions, so neither can ship without the
  # other.
  #
  # It also runs the real query builder under a sentinel driver id (a non-empty
  # result would mean the per-driver scope has stopped holding — the one failure
  # here that is a privacy problem rather than an empty list), the board's own
  # queries, and a metadata retrieve confirming the search box's parser model
  # still exists. No completion is ever billed.
  #
  # Two more silent failures added 2026-08-11, both proven against live records
  # rather than asserted from settings:
  #   - the text fallback. The search parser leaves unclassifiable prose in the
  #     query ("a $90 order that barely paid anything" leaves "barely paid
  #     anything"), and Algolia's removeWordsIfNoResults:"allOptional" does NOT
  #     rescue it — that only relaxes the AND between words to an OR, so a
  #     phrase where no word matches anything still returns nothing. The builder
  #     retries once with the text removed; without that, one stray adjective
  #     vetoes a perfect filter set and the driver is told they have no such
  #     deliveries. The check runs the pair and compares counts;
  #   - the two scopes. "available" is the unclaimed pool and is scoped by
  #     STATUS, not driverID (it has none). If that ever started honouring a
  #     driver id it would return nothing and every driver would be told there
  #     is no work; if "mine" stopped honouring one, a driver would see somebody
  #     else's history. Both directions are checked with the sentinel.
  # The fallback half is SKIPPED, not failed, when the pool is empty — no
  # unclaimed work is a normal Tuesday, not an incident.
  #
  # ~9 Algolia getSettings plus five searches, several Firestore reads and that
  # model lookup, hence the wider bound than a single-query check.
  - name: Driver Deliveries and Search
    slug: driver-orders-flow
    url: https://www.sarvabazaar.com/api/health/flow-driver-orders
    maxResponseTime: 10000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # Broader than the name suggests, and deliberately so. This used to call a
  # pure function with an empty array and assert the totals came back zero —
  # green forever, whatever happened to the real thing. It now exercises the
  # actual path: the customer_stats cache read, the fingerprint query and the
  # recent-orders read, then asserts the payload's SHAPE field by field.
  #
  # That payload is what BOTH customer assistants answer spending questions
  # from (injected as context for the text engine, returned by get_metrics for
  # voice) as well as what the dashboard renders, so a red here means all three
  # are wrong — not just the page. It also pushes a real order through the
  # separate module the PDF/Excel downloads are built from.
  #
  # Real Firestore reads now, so it shares the 5s bound of the other
  # Firestore-backed flows rather than the sub-second one a pure function had.
  - name: Customer Dashboard
    slug: customer-metrics-flow
    url: https://www.sarvabazaar.com/api/health/flow-customer-metrics
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # A shopper's order history — the My Orders page's Past tab and the same
  # search both customer assistants run. All three are one Algolia query, and
  # every way it breaks is silent or actively misleading, so this asserts the
  # index's SHAPE rather than that Algolia answered:
  #   - a sort replica that doesn't exist is a hard 404 that fails the WHOLE
  #     search, so the shopper is told they have no orders;
  #   - a replica that exists but was never given a ranking formula returns the
  #     primary's order, so ascending and descending come back identical;
  #   - a numeric filter on an attribute that isn't declared for filtering
  #     EXCLUDES every record, so "orders over $50" reads as "you have never
  #     spent over $50".
  # It also runs the real query under a sentinel customer id (a non-empty result
  # would mean the per-customer scope has stopped holding, the one failure here
  # that shows too MUCH rather than too little), the live tab's Firestore query
  # (which needs its own composite index), and the export's metrics producer.
  #
  # No completion is ever billed — the one model call is a metadata retrieve
  # confirming the search box's parser model still exists, because a retired one
  # degrades to plain text matching without erring.
  #
  # Added 2026-08-11: the same text fallback the driver check covers. The search
  # parser leaves unclassifiable prose in the query ("that big order that took
  # forever" leaves "took forever"), and removeWordsIfNoResults:"allOptional"
  # does NOT rescue it — it only relaxes the AND between words to an OR, so a
  # phrase where no word matches anything still returns nothing. The builder
  # retries once without the text; the check runs the pair and compares counts.
  # It samples a REAL shopper out of the index to do it, because this builder
  # always applies its customerID scope and a fake id would make both halves
  # agree at zero — a check that passes by matching nothing is worse than none.
  # Skipped, not failed, on an index with no finished orders.
  #
  # Five sequential Algolia getSettings plus four searches, two Firestore reads
  # and that model lookup, hence the wider bound than a single-query check.
  # Measured ~570-890ms server-side warm, ~780ms with the fallback pair.
  - name: Order History and Search
    slug: customer-orders-flow
    url: https://www.sarvabazaar.com/api/health/flow-customer-orders
    maxResponseTime: 10000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # A shopper's account page — the spending summary, the account age, and the
  # per-address order counts that BOTH customer assistants now quote back when
  # asked "how many orders went to my work address".
  #
  # Almost everything behind this page fails QUIETLY, which is what the check is
  # built around:
  #   - the per-address counter swallows a failed count deliberately, so the
  #     page loses a usage line instead of failing to render. The cost is that
  #     the count failing for EVERY address at once returns a perfectly
  #     well-formed empty result, indistinguishable from "this shopper has never
  #     ordered". The check re-runs that same counter in strict mode, so the
  #     failure has somewhere to surface;
  #   - those counts match an order's recorded delivery address against the
  #     saved one, so if checkout ever stops recording it, every address reads
  #     "no orders yet" forever and nothing errors anywhere. A sample of recent
  #     orders is checked for that field — sampled rather than one order,
  #     because a pickup order legitimately carries no delivery address;
  #   - every derived figure is legitimately zero for the sentinel account the
  #     check runs against, so the arithmetic — the spend breakdown, the
  #     averages, each store's share of spend — is re-run over a fixture with
  #     real numbers in it. Otherwise that half of the check could not fail.
  # It also confirms a profile for nobody comes back empty, which is the one
  # failure here that shows too MUCH rather than too little.
  #
  # The lifetime totals underneath are NOT re-verified here — Customer Dashboard
  # above already checks those field by field, off the same cached loader.
  #
  # Around seven Firestore round trips, so it shares the 5s bound of the other
  # Firestore-backed flows. Measured ~290-440ms server-side warm, 680ms cold.
  - name: Customer Profile
    slug: customer-profile-flow
    url: https://www.sarvabazaar.com/api/health/flow-customer-profile
    maxResponseTime: 5000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  - name: Guest Order Lookup
    slug: guest-order-lookup-flow
    url: https://www.sarvabazaar.com/api/health/flow-guest-order-lookup
    maxResponseTime: 8000
    headers:
      - "Authorization: Bearer $HEALTH_CHECK_SECRET"

  # ---------------- Upstream vendor status, checked directly ----------------
  # Confirmed via direct curl (not assumed) which vendors expose a real
  # public JSON status API vs. which don't:
  #   - OpenAI, GitHub: real Statuspage.io API at /api/v2/status.json
  #   - EmailJS: real Better Stack API at /index.json (different field names)
  #   - Stripe, Algolia: their status pages are custom-built SPAs — hitting
  #     /api/v2/status.json returns their HTML app shell, not real data, so
  #     these are plain page-load checks only (weaker signal: proves their
  #     status page is reachable, not a parsed operational/degraded state).
  # This answers "is it them or us" when one of our own checks above fails.

  - name: Vercel
    slug: upstream-vercel-status
    url: https://www.vercel-status.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: OpenAI
    slug: upstream-open-ai-status
    url: https://status.openai.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: GitHub
    slug: upstream-git-hub-status
    url: https://www.githubstatus.com/api/v2/status.json
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

  - name: EmailJS
    slug: upstream-email-js-status
    url: https://status.emailjs.com/index.json
    __dangerous__body_down_if_text_missing: '"aggregate_state":"operational"'

  - name: Stripe
    slug: upstream-stripe-status-page-only
    url: https://status.stripe.com/

  - name: Algolia
    slug: upstream-algolia-status-page-only
    url: https://status.algolia.com/

# Response-time chart on each per-monitor page. Upptime defaults to a mint
# green; these match the status green used elsewhere.
graphBackgroundColor: "rgba(118, 173, 42, 0.15)"
graphBorderColor: "#76ad2a"

status-website:
  cname: status.sarvabazaar.com

  # Rendered next to the wordmark in the masthead, so it reads "SARVA Status".
  # Also used as the browser tab title.
  name: Sarva Status
  # These MUST stay absolute, not "/favicon.png".
  # assets/ is copied into the site root only AFTER `npm run export` has run,
  # so during the export crawl a root-relative path does not exist yet. Sapper
  # fetches it, gets the SPA's 404 HTML back, and writes it as
  # `export/favicon.png/index.html` -- creating a DIRECTORY named favicon.png.
  # The asset copy that follows then dies with:
  #   cp: copyFileSync: could not write to dest file (code=EISDIR)
  # An absolute URL is a different origin from the export server, so the
  # crawler skips it; the file still resolves at runtime because assets/ lands
  # at the site root. scripts/preview.sh rewrites these to localhost so a local
  # preview does not pull them from the live site.
  logoUrl: https://status.sarvabazaar.com/favicon.png
  # Tab icon. Kept as the .ico for parity with the main site, which serves
  # /favicon.ico. Upptime hardcodes type="image/svg" and type="image/png" on
  # its two icon links with no config knob to change them, so the declared
  # MIME is wrong here; browsers sniff the bytes for rel=icon, so it renders.
  # logoUrl above stays the PNG: that is the 56px masthead image, where the
  # .ico's 32x32 would be upscaled.
  favicon: https://status.sarvabazaar.com/favicon.ico

  # No introTitle: the masthead already names the page, so a second heading
  # would just repeat it.

  # Single base theme so the cascade is predictable.
  theme: light

  css: |
    /* Sarva Bazaar status page.
       Layout, markup and behavior are Upptime's. This sets color, type and
       spacing only. The whole-card click target (article.link a::after) and the
       response-time graphs are left alone.
       Palette values are sampled from status.claude.com. */

    :root {
      --sb-bg: #faf9f5;
      --sb-surface: #ffffff;
      --sb-text: #141413;
      --sb-muted: #6b6a63;
      --sb-line: #dedcd1;

      --sb-green: #76ad2a;
      --sb-amber: #d18b1f;
      --sb-red: #c9432f;
      /* Response-time graphs, tinted by the service's current status. */
      --sb-graph-up: #b3d78d;
      --sb-graph-degraded: #f2d49b;
      --sb-graph-down: #efb0a4;

      --body-background-color: var(--sb-bg);
      --body-text-color: var(--sb-text);
      --card-background-color: var(--sb-surface);
      --card-border-color: var(--sb-line);
      --nav-background-color: var(--sb-bg);
      --nav-border-bottom-color: var(--sb-line);
      --nav-current-border-bottom-color: var(--sb-text);
      --code-color: var(--sb-text);
      --code-background-color: var(--sb-bg);

      --up-border-left-color: var(--sb-green);
      --degraded-border-left-color: var(--sb-amber);
      --down-border-left-color: var(--sb-red);
      --down-background-color: var(--sb-surface);

      --tag-color: #ffffff;
      --tag-up-background-color: var(--sb-green);
      --tag-degraded-background-color: var(--sb-amber);
      --tag-down-background-color: var(--sb-red);
      /* brief flash behind a value when the selected range changes */
      --change-background-color: #dcecc4;

      --error-button-border-color: var(--sb-text);
      --error-button-background-color: var(--sb-text);
      --error-button-color: #ffffff;
      --submit-button-border-color: var(--sb-text);
      --submit-button-background-color: var(--sb-text);
      --submit-button-color: #ffffff;

      --graph-opacity: 1;
      --graph-filter: none;
    }

    html body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      background: var(--sb-bg);
      color: var(--sb-text);
      line-height: 1.5;
    }

    body .container {
      max-width: 860px;
    }

    body h1,
    body h2,
    body h3,
    body h4 {
      color: var(--sb-text);
      font-weight: 600;
    }

    body a,
    body h1 a,
    body h2 a,
    body h3 a,
    body h4 a {
      color: var(--sb-text);
    }

    /* ---------- Masthead: wordmark followed by the site name ---------- */

    body nav {
      background: var(--sb-bg);
      border-bottom: 0;
      padding: 0;
      margin-bottom: 1.5rem;
    }

    body nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      padding-bottom: 0px !important;
    }

    body a.error-button {
      margin-top: 1rem;
    }

    body nav .logo {
      float: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      margin: 0;
      text-decoration: none;
    }

    body nav {
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
    }

    /* The wordmark is set to the cap height of the name beside it so the two
       read as a single line of text rather than an image plus a label.
       Nav.svelte ships `.logo.svelte-<hash> img.svelte-<hash> { height: 3rem }`,
       which is more specific than anything that can be written here (the hash
       changes on template updates and cannot be referenced), so these need
       !important to apply. Change `height` to resize the wordmark. */
    body nav .logo img {
      height: 56px !important;
      width: auto !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }

    body nav .logo div {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--sb-text);
      line-height: 1 !important;
      margin-top: -1px !important;
    }

    body nav ul {
      margin: 0;
      padding: 0;
    }

    /* On service-history pages, the existing logo link already points home.
       Present it like the incident page's simple footer link instead of
       repeating the masthead used on the status homepage. */
    body:not(:has(main > section.live-status)) nav .logo img,
    body:not(:has(main > section.live-status)) nav .logo div {
      display: none;
    }

    body:not(:has(main > section.live-status)) nav .logo {
      padding: 0;
      margin: 0;
      margin-bottom: 1.5rem;
      border: 0;
      border-radius: 0;
      font-size: 0.85rem !important;
      font-weight: 400 !important;
      line-height: 1 !important;
      color: var(--sb-muted) !important;
      text-decoration: underline !important;
      text-underline-offset: 3px !important;
    }

    body:not(:has(main > section.live-status)) nav .logo:hover {
      color: var(--sb-text);
    }

    body:not(:has(main > section.live-status)) nav .logo::after {
      content: "← Back to status";
    }

    /* Incident pages already provide their own “Back to all incidents” link
       at the end of the page, and the error page provides “Return home”.
       Neither needs a second navigation link. */
    body:has(main > h2 + section + footer) nav,
    body:has(main > a.error-button) nav {
      display: none;
    }

    /* The hidden nav normally supplies this top breathing room. Keep it on
       pages that use their own return link so their content is not flush with
       the viewport. */
    body:has(main > h2 + section + footer) main.container,
    body:has(main > a.error-button) main.container {
      padding-top: 53px;
    }

    /* ---------- Overall status banner ---------- */
    /* Upptime hardcodes a leading emoji in this element, so the element's own
       text is collapsed to zero and the label is restated here.
       i18n.allSystemsOperational stays set as the no-CSS fallback. */

    main.container > article.up,
    main.container > article.degraded,
    main.container > article.down {
      font-size: 0;
      border: 0;
      border-radius: 4px;
      padding: 14px 20px;
      margin-top: 1.5rem !important;
    }

    main.container > header {
      margin-bottom: 0 !important;
    }

    main.container > article.up::before,
    main.container > article.degraded::before,
    main.container > article.down::before {
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
    }

    main.container > article.up {
      background: var(--sb-green);
    }
    main.container > article.up::before {
      content: "All Systems Operational";
    }

    main.container > article.degraded {
      background: var(--sb-amber);
    }
    main.container > article.degraded::before {
      content: "Degraded Performance";
    }

    main.container > article.down,
    main.container > article.down-active {
      background: var(--sb-red);
    }
    main.container > article.down::before {
      content: "Service Disruption";
    }

    /* ---------- Component list ---------- */
    /* Upptime's own card layout is kept: separate cards, each with the status
       colour on its left edge and its response-time graph on the right. */

    section.live-status article h4 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    section.live-status article > div {
      color: var(--sb-muted);
      font-size: 0.82rem;
    }

    /* No `background` here: Upptime flashes these values on a range switch via
       `.changed + section .data { background: var(--change-background-color) }`,
       fading it out with its own 0.3s transition. Setting a background would
       disable that animation. */
    section.live-status article .data {
      color: var(--sb-text);
      font-weight: 500;
    }

    /* Response-time graph, recoloured.
       The source PNGs are mint on a transparent background, so they are used as
       a mask and painted in the page's green instead. Geometry is copied from
       Upptime's own rule (contain / no-repeat / center right) so the graph is
       drawn exactly where and how it was before.
       `article` is already position:relative, so adding z-index:0 makes it a
       stacking context; the mask then sits above the card background but below
       the text, and the full-card click overlay (article.link a::after) keeps
       the article as its containing block and still covers the whole card. */
    section.live-status article.graph {
      z-index: 0;
      background-image: none !important;
    }

    section.live-status article.graph::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      /* keeps the graph inside the card's rounded corners */
      border-radius: inherit;
      background: var(--sb-graph-up);
      -webkit-mask-image: var(--background);
      mask-image: var(--background);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center right;
      mask-position: center right;
    }

    section.live-status article.degraded.graph::after {
      background: var(--sb-graph-degraded);
    }

    section.live-status article.down.graph::after {
      background: var(--sb-graph-down);
    }

    /* ---------- Per-monitor descriptions ---------- */
    /* Upptime has no description field, so the text is keyed to each row's
       history link below. Rows without a match render without the line. */

    section.live-status article h4::after {
      display: block;
      margin-top: 3px;
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--sb-muted);
    }

    section.live-status article:has(a[href$="/history/website"]) h4::after {
      content: "Main storefront and public pages at sarvabazaar.com.";
    }

    section.live-status article:has(a[href$="/history/guest-shop"]) h4::after {
